site_name: ŁKS KM Junior
site_url: https://piotrlew-creator.github.io/lks-junior/
site_description: >-
  Akademia koszykówki młodzieżowej ŁKS KM w Łodzi. Grupy wiekowe U10–U19,
  harmonogram treningów, turnieje, kadra trenerska i zapisy dla nowych
  zawodników.
site_author: ŁKS KM Junior
copyright: Copyright &copy; ŁKS KM Junior

theme:
  name: material
  language: pl
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Strona główna: index.md
  - O Akademii: o-klubie.md
  - Grupy wiekowe: grupy-wiekowe.md
  - Harmonogram treningów: harmonogram.md
  - Turnieje i wydarzenia: turnieje.md
  - Kadra trenerska: trenerzy.md
  - Dołącz do nas: dolacz.md
  - FAQ: faq.md
  - Strefa sponsora: sponsor.md
  - Kontakt: kontakt.md

extra:
  social:
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/UZUPEŁNIJ-LINK-FB
      name: ŁKS KM Junior na Facebooku
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/UZUPEŁNIJ-LINK-IG
      name: ŁKS KM Junior na Instagramie
    - icon: fontawesome/solid/envelope
      link: mailto:kontakt@lkskm.pl
      name: Napisz do nas
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      type: date
      locale: pl
      fallback_to_build_date: true

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      title: Na tej stronie
