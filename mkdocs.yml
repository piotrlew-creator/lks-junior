site_name: ŁKS KM Szkoła Gortata
site_url: https://lkskmjunior.pl/
site_description: >-
  Akademia koszykówki ŁKS KM Szkoła Gortata w Łodzi. Grupy młodzieżowe
  od U11 po U19 i zespół seniorski w 2 lidze — harmonogram treningów,
  kadra trenerska, turnieje i zapisy.
site_author: ŁKS KM Szkoła Gortata
copyright: Copyright &copy; ŁKS KM Szkoła Gortata

theme:
  name: material
  language: pl
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Barlow
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - Start: index.md
  - Aktualności:
      - aktualnosci/index.md
  - Akademia: akademia.md
  - Strefa rodzica:
      - strefa-rodzica/index.md
      - U11: strefa-rodzica/u11.md
      - U12: strefa-rodzica/u12.md
      - U13: strefa-rodzica/u13.md
      - U14: strefa-rodzica/u14.md
      - U15: strefa-rodzica/u15.md
      - U17: strefa-rodzica/u17.md
      - U19: strefa-rodzica/u19.md
      - 2 liga: strefa-rodzica/dwa-liga.md
  - Dołącz do Akademii: dolacz.md
  - Zostań sponsorem: sponsorzy.md
  - Kontakt: kontakt.md

extra:
  social:
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/lksKMjunior
      name: Znajdź nas na Facebooku
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/UZUPEŁNIJ-LINK-IG
      name: Znajdź nas na Instagramie
    - icon: fontawesome/solid/envelope
      link: mailto:kontakt@lkskm.pl
      name: Napisz do biura
  generator: false

extra_css:
  - stylesheets/extra.css?v=3

extra_javascript:
  - javascripts/extra.js?v=3

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - glightbox:
      touchNavigation: true
      loop: false
      draggable: true
      skip_classes:
        - no-lightbox
  - blog:
      blog_dir: aktualnosci
      blog_toc: false
      post_url_format: "{slug}"
      post_excerpt: optional
      archive: true
      archive_name: Archiwum
      categories: true
      categories_name: Drużyny
      post_readtime: false
      pagination_per_page: 8

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      title: Na tej stronie
